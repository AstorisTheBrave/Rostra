name: CI

# Opt JS actions into the Node 24 runner ahead of the June 2026 cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the cached env config loads during typecheck/tests.
      DISCORD_TOKEN: ci-placeholder-token
      DISCORD_CLIENT_ID: "0"
      DATABASE_URL: postgresql://user:pass@localhost:5432/rostra
      NODE_ENV: test
      INTERNAL_API_TOKEN: ci-placeholder-internal-token
      WEB_SESSION_SECRET: ci-placeholder-web-session-secret-32-chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 22+: the built-in test runner expands workspace test globs.
          node-version: 22
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Repository and workspace boundaries
        run: pnpm check:boundaries
      - name: Typecheck
        run: pnpm typecheck
      - name: Build all applications
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Guard against legacy embeds (Components V2 only)
        run: |
          if grep -rn "EmbedBuilder" apps modules packages --include='*.ts' --exclude-dir={node_modules,archive,Archive,.superpowers,dist,build,coverage,secrets,.turbo}; then
            echo "::error::EmbedBuilder found - this project uses Components V2 only."
            exit 1
          fi
      - name: Guard undercover mode (no AI provider names)
        run: |
          if grep -rinE "openai|anthropic|claude|groq|\bgpt\b|gemini|\bllama\b|mistral" apps modules packages --include='*.ts' --exclude-dir={node_modules,archive,Archive,.superpowers,dist,build,coverage,secrets,.turbo}; then
            echo "::error::AI provider reference found - undercover mode forbids this."
            exit 1
          fi
      - name: Guard UI library (modules must not hand-roll component builders)
        run: |
          if grep -rnE "new (ButtonBuilder|ActionRowBuilder|ContainerBuilder|StringSelectMenuBuilder|ModalBuilder|TextInputBuilder)" modules; then
            echo "::error::Module hand-rolls a component builder - use @rostra/discord-ui instead."
            exit 1
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rostra
          POSTGRES_PASSWORD: rostra
          POSTGRES_DB: rostra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rostra:rostra@localhost:5432/rostra
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: fatal
      INTERNAL_API_TOKEN: ci-placeholder-internal-token
      WEB_SESSION_SECRET: ci-placeholder-web-session-secret-32-chars
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Apply migrations and seed disposable guild rows
        run: |
          pnpm prisma:migrate
          pnpm --filter @rostra/api seed:browser-fixture
      - name: Install browser runtime
        run: pnpm --filter @rostra/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run fixture OAuth and database-backed browser smoke
        run: pnpm --filter @rostra/web test:browser --project=${{ matrix.browser }}
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: browser-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  service-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rostra
          POSTGRES_PASSWORD: rostra
          POSTGRES_DB: rostra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rostra:rostra@localhost:5432/rostra
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: fatal
      INTERNAL_API_TOKEN: ci-placeholder-internal-token
      WEB_SESSION_SECRET: ci-placeholder-web-session-secret-32-chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Apply forward migrations
        run: pnpm prisma:migrate
      - name: Refuse startup after a real failed PostgreSQL migration
        shell: bash
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" createdb -U rostra rostra_failed_migration
          failed_url="postgresql://rostra:rostra@localhost:5432/rostra_failed_migration"
          DATABASE_URL="$failed_url" pnpm prisma:migrate
          docker exec -i "$postgres_container" psql -U rostra -d rostra_failed_migration <<'SQL'
          INSERT INTO "_prisma_migrations"
            (id, checksum, started_at, migration_name, logs, applied_steps_count)
          VALUES
            ('phase01-failed-rehearsal', repeat('0', 64), now(),
             '99999999999999_phase01_failed_rehearsal', 'injected rehearsal failure', 0);
          SQL
          marker="${RUNNER_TEMP}/rostra-started"
          set +e
          startup_output="$(DATABASE_URL="$failed_url" MIGRATION_ATTEMPTS=1 MIGRATION_RETRY_SECONDS=0 \
            sh infra/start-app.sh sh -c "touch '$marker'" 2>&1)"
          startup_status=$?
          set -e
          printf '%s\n' "$startup_output"
          test "$startup_status" -ne 0
          grep -q 'P3009' <<< "$startup_output"
          test ! -e "$marker"
      - name: Cache revision and independent process proof
        run: pnpm --filter @rostra/cache test:integration
      - name: Atomic outbox and scheduled-task retention proof
        run: pnpm --filter @rostra/operations test:integration
      - name: Retain durable intent during a real Redis outage
        shell: bash
        run: |
          redis_container="$(docker ps --filter ancestor=redis:7-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$redis_container"
          docker stop "$redis_container"
          docker rm "$redis_container" 2>/dev/null || true
          node --import tsx tooling/scripts/phase01-redis-recovery.service.ts seed
      - name: Recover retained intent after Redis restarts
        shell: bash
        run: |
          redis_container="phase01-redis-restarted"
          docker run -d --name "$redis_container" -p 6379:6379 redis:7-alpine \
            redis-server --appendonly yes --maxmemory-policy noeviction
          for attempt in {1..20}; do
            if docker exec "$redis_container" redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "$redis_container" redis-cli ping)" = "PONG"
          node --import tsx tooling/scripts/phase01-redis-recovery.service.ts recover
      - name: Durable operation restart and duplicate-delivery proof
        run: pnpm --filter @rostra/workers test:integration
      - name: Collect API, tenant cache and durable-operation measurements
        run: node --import tsx tooling/scripts/phase01-collect.service.ts coverage/phase01-measurements/measurements.json
      - name: Validate Phase 01 measurement artifact
        run: node tooling/scripts/phase01-measure.mjs validate coverage/phase01-measurements/measurements.json > /dev/null
      - name: Preserve Phase 01 measurement evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: phase01-measurements-${{ github.run_id }}
          path: |
            coverage/phase01-measurements/measurements.json
            docs/phase-reports/01-platform-core/*.mdx
          if-no-files-found: ignore
          retention-days: 30
